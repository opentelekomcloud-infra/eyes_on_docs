name: Docker Image Build on tag or release

on:
  push:
    tags:
      - '*'
  release:
    types: [published]

env:
  ORG: opentelekomcloud
  PROJECT: eyes_on_docs

jobs:
  push_if_tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            "swr.eu-de.otc.t-systems.com/${{ env.ORG }}/${{ env.PROJECT }}"
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate SWR login key
        id: swr_key
        run: |
          LOGIN_KEY=$(printf "${{ secrets.SWR_AK }}" | \
            openssl dgst -binary -sha256 -hmac "${{ secrets.SWR_SK }}" | \
            od -An -vtx1 | \
            sed 's/[ \n]//g' | \
            sed 'N;s/\n//')
          echo "login_key=$LOGIN_KEY" >> $GITHUB_OUTPUT

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: swr.eu-de.otc.t-systems.com
          username: eu-de@${{ secrets.SWR_AK }}
          password: ${{ steps.swr_key.outputs.login_key }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: false

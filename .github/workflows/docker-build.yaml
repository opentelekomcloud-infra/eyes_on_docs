name: Docker Image Build

on:
  pull_request:
    types:
      - opened
      - closed
      - edited
      - reopened
      - synchronize

env:
  ORG: opentelekomcloud
  PROJECT: eyes_on_docs

permissions:
  contents: read

jobs:

  build:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          "${{ secrets.SWR_URL }}/${{ env.ORG }}/${{ env.PROJECT }}"
        tags: |
          type=schedule
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: false
        provenance: false
        build-args: |
          BASE_URL=${{ secrets.BASE_URL }}
          AUTH_TOKEN=${{ secrets.AUTH_TOKEN }}

  push_if_merged:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            "${{ secrets.SWR_URL }}/${{ env.ORG }}/${{ env.PROJECT }}"
          tags: |
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: check secrets present
        run: |
          echo "SWR_URL set: ${{ secrets.SWR_URL != '' }}"
          echo "SWR_USERNAME set: ${{ secrets.SWR_USERNAME != '' }}"
          echo "SWR_PASSWORD set: ${{ secrets.SWR_PASSWORD != '' }}"
          

      - name: Login to SWR Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.SWR_URL }}
          username: ${{ secrets.SWR_USERNAME }}
          password: ${{ secrets.SWR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # provenance diasbles attestation manifest generation, if true - Invalid image, fail to parse 'manifest.json'
          provenance: false
